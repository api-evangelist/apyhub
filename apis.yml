name: ApyHub
description: >-
  ApyHub is a marketplace of certified, production-ready HTTP APIs. One API key and one subscription
  work across every service in the catalog, metered in 'atoms' (a per-call credit unit). The catalog
  spans 451 services from 19 providers across 21 categories - AI, file conversion and manipulation,
  data extraction and validation, SEO, geolocation, finance, HR and more - and is MCP-ready by default.
  Every page is available as Markdown by appending .md to its path.
