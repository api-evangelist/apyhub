  version: 1.0.0
  contact:
    name: ApyHub
    url: https://apyhub.com/apyhub/service/remove-image-metadata
servers:
- url: https://api.apyhub.com
  description: ApyHub API
security:
- apyToken: []
tags:
- name: File Security
