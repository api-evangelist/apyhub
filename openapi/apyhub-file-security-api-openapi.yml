      operationId: postProcessorImageRemoveMetadataFile
      summary: Remove Image Metadata API
      description: Uploads an image as multipart form data, strips the specified metadata keys from it, a
      tags:
      - File Security
      responses:
        '200':
          description: Successful response
        '401':
          description: Missing or invalid API key
