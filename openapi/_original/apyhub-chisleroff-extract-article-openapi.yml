# Paths verified callable against https://api.apyhub.com (401 = exists + gated).
# Request/response schemas are NOT published by ApyHub and are deliberately omitted.
openapi: 3.1.0
info:
  title: Extract Article From Web API
  description: Extract article text from a webpage URL and get title, author, date, images, language,
    word count, source URL, and confidence scores.
  version: 1.0.0
  contact:
    name: Website Intelligence
    url: https://apyhub.com/chisleroff/service/extract-article
servers:
- url: https://api.apyhub.com
  description: ApyHub API
security:
- apyToken: []
tags:
- name: Data Extraction
paths:
  /chisleroff/extract/article:
    post:
      operationId: postChisleroffExtractArticle
      summary: Extract Article From Web API
      description: Extracts article content and metadata from a webpage URL. The request sends a webpage
      tags:
      - Data Extraction
      responses:
        '200':
          description: Successful response
        '401':
          description: Missing or invalid API key
      x-apyhub-atoms: 100
components:
  securitySchemes:
    apyToken:
      type: apiKey
      in: header
      name: apy-token
