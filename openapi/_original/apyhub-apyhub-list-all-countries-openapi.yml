  version: 1.0.0
  contact:
    name: ApyHub
    url: https://apyhub.com/apyhub/service/list-all-countries
servers:
- url: https://api.apyhub.com
  description: ApyHub API
security:
- apyToken: []
tags:
- name: Geolocation
- name: Standard Data
paths:
  /data/dictionary/country:
    get:
      operationId: getDataDictionaryCountry
      summary: Countries Dictionary API
      description: Returns a JSON object containing a data array of country records. Response Returns
        a J
      tags:
      - Geolocation
      - Standard Data
      responses:
        '200':
          description: Successful response
        '401':
          description: Missing or invalid API key
      x-apyhub-atoms: 5
components:
  securitySchemes:
    apyToken:
      type: apiKey
      in: header
      name: apy-token
