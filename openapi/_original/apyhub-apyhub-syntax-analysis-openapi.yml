servers:
- url: https://api.apyhub.com
  description: ApyHub API
security:
- apyToken: []
tags:
- name: Artificial Intelligence
- name: Developer Tools
paths:
  /ai/text/syntax/analysis:
    post:
      operationId: postAiTextSyntaxAnalysis
      summary: AI Text Syntax Analysis API
      description: Analyzes submitted text using the requested syntax-analysis service and returns a JSON
      tags:
      - Artificial Intelligence
      - Developer Tools
      responses:
        '200':
          description: Successful response
        '401':
          description: Missing or invalid API key
