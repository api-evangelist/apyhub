  contact:
    name: ApyHub
    url: https://apyhub.com/apyhub/service/verify-email-validity-and-deliverability
servers:
- url: https://api.apyhub.com
  description: ApyHub API
security:
- apyToken: []
tags:
- name: Communications
- name: Data Validation
- name: Marketing
paths:
  /validate/email/dns:
    post:
      operationId: postValidateEmailDns
      summary: Validate Email DNS API (Including Disposable Emails)
      description: Verifies whether an email address is valid and deliverable. The request sends an email
      tags:
      - Communications
      - Data Validation
      - Marketing
      responses:
        '200':
          description: Successful response
        '401':
          description: Missing or invalid API key
      x-apyhub-atoms: 25
components:
