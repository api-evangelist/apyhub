# Derived by API Evangelist from ApyHub's own published service documentation
# (https://apyhub.com/llms.txt -> https://apyhub.com/apyhub/service/serp-rankings-for-keyword).
# Paths verified callable against https://api.apyhub.com (401 = exists + gated).
# Request/response schemas are NOT published by ApyHub and are deliberately omitted.
openapi: 3.1.0
info:
  title: SERP Rank Checker API
  description: Get ranked search results for a keyword with language and location options. Returns URLs,
    titles, domains, and descriptions for SEO analysis.
  version: 1.0.0
  contact:
    name: ApyHub
    url: https://apyhub.com/apyhub/service/serp-rankings-for-keyword
servers:
- url: https://api.apyhub.com
  description: ApyHub API
security:
- apyToken: []
tags:
- name: SEO
paths:
  /extract/serp/rank:
    post:
      operationId: postExtractSerpRank
      summary: SERP Rank Checker API
      description: Retrieves SERP rankings for a keyword and returns the matching results in the response
      tags:
      - SEO
      responses:
        '200':
          description: Successful response
        '401':
          description: Missing or invalid API key
      x-apyhub-atoms: 250
components:
  securitySchemes:
    apyToken:
      type: apiKey
      in: header
      name: apy-token
