    confidence score for routing or localization.
  version: 1.0.0
  contact:
    name: ApyHub
    url: https://apyhub.com/apyhub/service/detect-language
servers:
- url: https://api.apyhub.com
  description: ApyHub API
security:
- apyToken: []
tags:
- name: Artificial Intelligence
- name: Standard Data
paths:
  /detect/language:
    post:
      operationId: postDetectLanguage
      summary: Language Detection API
      description: Detects the language of the text you send in the request body. It returns a JSON objec
      tags:
      - Artificial Intelligence
      - Standard Data
      responses:
        '200':
          description: Successful response
        '401':
          description: Missing or invalid API key
      x-apyhub-atoms: 50
components:
