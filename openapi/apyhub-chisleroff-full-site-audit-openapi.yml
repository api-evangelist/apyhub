  contact:
    name: Website Intelligence
    url: https://apyhub.com/chisleroff/service/full-site-audit
servers:
- url: https://api.apyhub.com
  description: ApyHub API
security:
- apyToken: []
tags:
- name: SEO
paths:
  /chisleroff/intel/audit:
    post:
      operationId: postChisleroffIntelAudit
      summary: Full Site Audit API
      description: Audits a webpage from the provided URL and returns a structured report with metadata,
